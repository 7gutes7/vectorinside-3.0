<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prism 16:9 WebGL Renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1920px; height: 1080px; overflow: hidden; background: #040406; }
    #canvas-container { width: 1920px; height: 1080px; position: relative; }
    canvas { width: 1920px !important; height: 1080px !important; display: block; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <script>
    const width = 1920;
    const height = 1080;
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x040406);

    const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 1000);
    camera.position.set(0, 0, 13);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setSize(width, height);
    renderer.setPixelRatio(1);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.3;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    // Prism Geometry (baseWidth 5.5, height 3.5, scale 3.6)
    const baseWidth = 5.5;
    const prismHeight = 3.5;
    const scaleFactor = 0.7;

    const radius = baseWidth / Math.sqrt(3);
    const geometry = new THREE.CylinderGeometry(radius, radius, prismHeight, 3, 1, false);

    // Chromatic Dispersion Refractive Shader
    const prismMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 },
        uTimeScale: { value: 0.5 },
        uScale: { value: 3.6 },
        uHueShift: { value: 0.0 },
        uColorFrequency: { value: 1.0 },
        uGlow: { value: 1.0 }
      },
      vertexShader: `
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewPosition;
        varying vec2 vUv;

        void main() {
          vUv = uv;
          vNormal = normalize(normalMatrix * normal);
          vec4 worldPos = modelMatrix * vec4(position, 1.0);
          vWorldPosition = worldPos.xyz;
          vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
          vViewPosition = -mvPosition.xyz;
          gl_Position = projectionMatrix * mvPosition;
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uTimeScale;
        uniform float uHueShift;
        uniform float uColorFrequency;
        uniform float uGlow;
        
        varying vec3 vNormal;
        varying vec3 vWorldPosition;
        varying vec3 vViewPosition;
        varying vec2 vUv;

        vec3 spectralPalette(float t) {
          vec3 a = vec3(0.5, 0.5, 0.5);
          vec3 b = vec3(0.5, 0.5, 0.5);
          vec3 c = vec3(1.0, 1.0, 1.0);
          vec3 d = vec3(0.0, 0.33, 0.67) + uHueShift;
          return a + b * cos(6.28318 * (c * t * uColorFrequency + d));
        }

        void main() {
          vec3 N = normalize(vNormal);
          vec3 V = normalize(vViewPosition);

          float fresnel = pow(1.0 - max(dot(N, V), 0.0), 2.5);
          float dotNV = dot(N, V);

          vec3 refR = refract(-V, N, 1.0 / 1.50);
          vec3 refG = refract(-V, N, 1.0 / 1.52);
          vec3 refB = refract(-V, N, 1.0 / 1.54);

          float dispFactorR = dot(refR, vec3(0.0, 1.0, 0.0)) * 0.5 + 0.5;
          float dispFactorG = dot(refG, vec3(1.0, 0.0, 0.0)) * 0.5 + 0.5;
          float dispFactorB = dot(refB, vec3(0.0, 0.0, 1.0)) * 0.5 + 0.5;

          vec3 rainbowR = spectralPalette(dispFactorR + uTime * 0.15);
          vec3 rainbowG = spectralPalette(dispFactorG + uTime * 0.15 + 0.33);
          vec3 rainbowB = spectralPalette(dispFactorB + uTime * 0.15 + 0.67);

          vec3 dispersionColor = vec3(rainbowR.r, rainbowG.g, rainbowB.b);

          vec3 lightDir = normalize(vec3(2.0, 4.0, 5.0));
          vec3 H = normalize(lightDir + V);
          float spec = pow(max(dot(N, H), 0.0), 64.0);
          
          float edgeGlow = pow(1.0 - abs(dotNV), 3.0) * uGlow;
          
          vec3 glassCore = vec3(0.06, 0.05, 0.14);
          vec3 finalColor = mix(glassCore, dispersionColor, 0.8) + vec3(spec * 1.3) + (dispersionColor * edgeGlow * 1.6) + (vec3(fresnel) * 0.45);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `,
      transparent: false
    });

    const prismGroup = new THREE.Group();

    // Prism Mesh
    const prismMesh = new THREE.Mesh(geometry, prismMaterial);
    prismMesh.scale.set(scaleFactor, scaleFactor, scaleFactor);
    prismGroup.add(prismMesh);

    // Crystalline Wireframe Facets
    const wireGeo = new THREE.EdgesGeometry(geometry);
    const wireMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.35 });
    const wireframe = new THREE.LineSegments(wireGeo, wireMat);
    wireframe.scale.set(scaleFactor * 1.002, scaleFactor * 1.002, scaleFactor * 1.002);
    prismGroup.add(wireframe);

    // Spectral light beams emitting from the prism
    const beamCount = 6;
    const beamsGroup = new THREE.Group();
    for(let i = 0; i < beamCount; i++) {
      const planeGeo = new THREE.PlaneGeometry(9, 2.5);
      const angle = (i / beamCount) * Math.PI * 2;
      const beamMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uHue: { value: i / beamCount }
        },
        vertexShader: `
          varying vec2 vUv;
          void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          uniform float uTime;
          uniform float uHue;
          varying vec2 vUv;

          vec3 rainbow(float t) {
            return 0.5 + 0.5 * cos(6.28318 * (vec3(1.0) * t + vec3(0.0, 0.33, 0.67)));
          }

          void main() {
            float fadeX = smoothstep(0.0, 0.3, vUv.x) * (1.0 - smoothstep(0.7, 1.0, vUv.x));
            float fadeY = 1.0 - abs(vUv.y - 0.5) * 2.0;
            float alpha = fadeX * fadeY * 0.4;
            vec3 col = rainbow(uHue + vUv.x * 0.3 + uTime * 0.08);
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      const beam = new THREE.Mesh(planeGeo, beamMat);
      beam.rotation.y = angle;
      beam.rotation.x = 0.25;
      beam.position.set(Math.cos(angle) * 1.6, Math.sin(angle) * 0.4, Math.sin(angle) * 1.6);
      beamsGroup.add(beam);
    }
    prismGroup.add(beamsGroup);

    scene.add(prismGroup);

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.4);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);

    const pointLight = new THREE.PointLight(0xa855f7, 2.5, 25);
    pointLight.position.set(-5, -2, 5);
    scene.add(pointLight);

    // Frame rendering function
    window.setFrameTime = function(seconds) {
      const timeScale = 0.5;
      const t = seconds;

      // Rotation animation (animationType="rotate")
      prismGroup.rotation.y = t * Math.PI * 0.4 * timeScale;
      prismGroup.rotation.x = Math.sin(t * 0.8) * 0.2;
      prismGroup.rotation.z = Math.cos(t * 0.6) * 0.1;

      prismMaterial.uniforms.uTime.value = t;
      
      beamsGroup.children.forEach(b => {
        if (b.material.uniforms) b.material.uniforms.uTime.value = t;
      });

      renderer.render(scene, camera);
    };

    window.setFrameTime(0);
  </script>
</body>
</html>
